<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login - Forsaken Wiki Issue Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Login</h1>

  <p>Enter your Fandom username to generate your verification code:</p>

  <form id="loginForm">
    <label for="username">Fandom Username:</label>
    <input type="text" id="username" required>
    <button type="submit">Generate Verification Code</button>
  </form>

  <div id="verification"></div>

  <script src="login.js"></script>
</body>
</html>
